name: 报告问题
description: 帮助我们复现并修复使用中的问题
title: "[Bug] "
body:
  - type: input
    id: windows
    attributes:
      label: Windows 版本、显示器和缩放比例
      placeholder: Windows 11，单显示器，150% 缩放
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 晒衣绳版本与使用方式
      placeholder: v0.1.4 安装版 / 便携版
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 怎么触发，实际发生了什么，原本希望怎样
      description: 请按操作顺序描述，方便复现。
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: 错误文字或截图（可选）
      description: 上传前请遮住个人资料，不要发送密码、Token 或私人截图。
